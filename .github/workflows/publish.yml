name: Publish verified APK (manual)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing draft release tag and staging branch suffix, e.g. v0.1.9'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: publish-public-apk
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: release-staging-${{ inputs.version }}
          persist-credentials: false
      - name: Verify checksum and permanent signing certificate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import glob, hashlib, os, pathlib, re, subprocess
          version = os.environ['RELEASE_VERSION']
          assert re.fullmatch(r'v\d+\.\d+\.\d+', version), 'Invalid release tag'
          apk = pathlib.Path(f'pogo-assistant-{version}.apk')
          checksum = pathlib.Path(f'{apk}.sha256').read_text().split()
          assert len(checksum) == 2 and checksum[1] == apk.name, 'Invalid checksum filename'
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == checksum[0], 'APK checksum mismatch'
          signers = sorted(glob.glob(os.environ['ANDROID_HOME'] + '/build-tools/*/apksigner'))
          assert signers, 'Android signature verifier unavailable'
          result = subprocess.run([signers[-1], 'verify', '--print-certs', str(apk)], check=True, text=True, capture_output=True)
          certificates = re.findall(r'Signer #\d+ certificate SHA-256 digest: ([0-9a-f]+)', result.stdout)
          assert certificates == ['472a6e48c227ce2996b77666e7d2e7d6fe67b3a7b4b48eb13ee68ae084708f9a'], 'Unexpected signing certificate'
          print('Verified APK checksum and permanent signing certificate.')
          PY
      - name: Attach APK and publish normal latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_VERSION" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_VERSION" "pogo-assistant-$RELEASE_VERSION.apk" "pogo-assistant-$RELEASE_VERSION.apk.sha256" --clobber
          gh release edit "$RELEASE_VERSION" --draft=false --prerelease=false --latest=true
